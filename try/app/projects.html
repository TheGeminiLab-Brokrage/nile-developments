<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' data: blob:; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data: blob:; frame-src 'self' blob:; worker-src 'self' blob:; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex, nofollow">
<script src="setup.js"></script>
<script src="../shim.js" data-app="mm"></script>
<link rel="stylesheet" href="../fonts.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sample Developer — Choose a project</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css?v=149">
</head>
<body class="is-picker">


<div class="xfade" id="xfade" aria-hidden="true">
  <span class="xf-line xf-l1 from-l"></span>
  <span class="xf-line xf-l2 from-r"></span>
  <span class="xf-line xf-l3 from-l"></span>
  <span class="xf-line xf-l4 from-r"></span>
  <div class="xf-copy">
    <p class="xf-granted" data-t="Access granted">Access granted</p>
    <p class="xf-select" data-t="Select a project">Select a project</p>
    <span class="xf-rule"></span>
  </div>
</div>
<script>(function(){try{var t=sessionStorage.getItem("mm.enter");sessionStorage.removeItem("mm.enter");if(!t||Date.now()-Number(t)>=4e3)return;document.documentElement.className+=" is-entering";document.body.className+=" no-entrance";document.getElementById("xfade").className="xfade is-on is-in no-anim"}catch(e){}})();</script>


<div class="markbuild" id="markbuild" aria-hidden="true"></div>

<div class="shell">

  <header class="top" data-in="1">
    <a class="brandmark" href="projects.html" aria-label="Sample Developer — all projects" data-t-aria="Sample Developer — all projects">
      <img src="img/company-wordmark.svg" alt="Sample Developer" class="logo-jpg">
    </a>
    <div class="who" id="who"></div>
    
    <ol class="steps" aria-label="Progress" data-t-aria="Progress">
      <li class="now" aria-current="step" data-t="Project">Project</li>
      <li data-t="Building & unit">Building &amp; unit</li>
      <li data-t="Offer">Offer</li>
    </ol>
  </header>

  <main class="picker">

    <section class="pick-intro">
      <p class="eyebrow" data-in="2" data-t="Choose a project">Choose a project</p>
      <h1 data-in="3" data-t-html="Our&lt;br&gt;projects&lt;span class=&quot;dot&quot;&gt;.&lt;/span&gt;">Our<br>projects<span class="dot">.</span></h1>
      <p class="pick-lede" data-in="4" data-t="Tap the project to start.">Tap the project to start.</p>
    </section>

    <div class="cards" id="live"></div>

    <div class="soonhead" id="soonhead" hidden>
      <h2 data-t="Coming soon">Coming soon</h2>
      <span class="rule-fill" aria-hidden="true"></span>
      <span class="count-label"><span class="count">0</span> <span data-t="in preparation">in preparation</span></span>
    </div>
    <div class="cards soon-cards" id="soon"></div>

    <footer class="pick-foot">
      <div class="marks"><img src="img/company-signature.svg" alt="Sample Developer"></div>
      <div class="gate-priv">
        <span data-t="Our projects">Our projects</span>
        <span id="buildstamp"></span>
      </div>
    </footer>

  </main>

</div>

<script src="js/config.js?v=149"></script>
<script src="js/i18n.js?v=149"></script>
<script src="js/brand.js?v=149"></script>
<script src="js/auth.js?v=149"></script>
<script src="js/markbuild.js?v=149"></script>
<script src="js/app.js?v=149"></script>
</body>
</html>
